<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imágenes y Galería - Ejercicio 9</title>
    <style>
        :root {
            --primary: #4f46e5;
            --accent: #06b6d4;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        nav {
            width: 100%;
            max-width: 900px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        nav ul {
            display: flex;
            justify-content: space-around;
            align-items: center;
            list-style: none;
            gap: 10px;
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 8px 14px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        nav a:hover {
            color: var(--accent);
            background-color: rgba(6, 182, 212, 0.1);
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 25px;
            text-align: center;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .gallery-item {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5deg);
            border-color: var(--accent);
            box-shadow: 0 8px 20px rgba(6, 182, 212, 0.2);
        }

        .gallery-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .gallery-item p {
            padding: 12px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Modal / Ventana Emergente */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            max-width: 800px;
            max-height: 80vh;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .close-btn:hover {
            color: var(--accent);
        }

        .nav-footer {
            text-align: center;
            margin-top: 25px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
            color: var(--primary);
        }
    </style>
</head>

<body>

    <nav>
        <ul>
            <li><a href="ej07.html#sobre-mi">Sobre mí</a></li>
            <li><a href="ej07.html#intereses">Intereses</a></li>
            <li><a href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a></li>
        </ul>
    </nav>

    <main class="container">
        <h1>Galería de Pasatiempos</h1>

        <div class="gallery-grid">
            <div class="gallery-item"
                onclick="openModal('https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=800')">
                <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=400" alt="Programación">
                <p>Programación & Código</p>
            </div>

            <div class="gallery-item"
                onclick="openModal('https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=800')">
                <img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=400" alt="Videojuegos">
                <p>Videojuegos & Gaming</p>
            </div>

            <div class="gallery-item"
                onclick="openModal('https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=800')">
                <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400" alt="Hardware">
                <p>Hardware & Tecnología</p>
            </div>
        </div>

        <div class="nav-footer">
            <a href="index.html" class="btn-back">&larr; Volver al Menú Principal</a>
        </div>
    </main>

    <!-- Modal Emergente -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-btn">&times;</span>
        <img id="modalImg" class="modal-content" src="" alt="Vista ampliada">
    </div>

    <script>
        function openModal(imageSrc) {
            document.getElementById('modalImg').src = imageSrc;
            document.getElementById('imageModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }
    </script>

</body>

</html>
