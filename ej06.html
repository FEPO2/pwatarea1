<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseño de Caja - Ejercicio 6</title>
    <style>
        :root {
            --primary: #4f46e5;
            --accent: #06b6d4;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 25px;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Caja estilizada requerida */
        .styled-box {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.2) 0%, rgba(6, 182, 212, 0.2) 100%);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            box-shadow: inset 0 0 15px rgba(6, 182, 212, 0.1);
        }

        .styled-box p {
            font-size: 1.1rem;
            color: var(--text-main);
            font-weight: 600;
            text-align: center;
        }

        .slider-container {
            width: 100%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .slider-container label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .nav-footer {
            text-align: center;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
            color: var(--primary);
        }
    </style>
</head>

<body>

    <main class="container">
        <h1>Diseño de Caja</h1>

        <!-- Contenedor con borde, fondo coloreado, texto centrado y slider -->
        <div class="styled-box">
            <p>Este texto se encuentra exactamente en el centro de la caja estilizada.</p>

            <div class="slider-container">
                <label for="range-slider">Ajuste de Intensidad (Slider):</label>
                <input type="range" id="range-slider" name="range-slider" min="0" max="100" value="50">
            </div>
        </div>

        <div class="nav-footer">
            <a href="index.html" class="btn-back">&larr; Volver al Menú Principal</a>
        </div>
    </main>

</body>

</html>
