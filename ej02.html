<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces y Listas - Ejercicio 2</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --accent: #06b6d4;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            text-align: center;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-box {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.2rem;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            background: linear-gradient(135deg, var(--primary) 0%, #3730a3 100%);
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        .social-link:hover {
            background: linear-gradient(135deg, var(--primary-hover) 0%, #312e81 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
        }

        ul {
            list-style-type: none;
            padding-left: 0;
        }

        ul li {
            position: relative;
            padding-left: 25px;
            margin-bottom: 10px;
            color: var(--text-muted);
            font-size: 1rem;
        }

        ul li::before {
            content: '✦';
            position: absolute;
            left: 0;
            color: var(--accent);
            font-size: 0.9rem;
        }

        .nav-footer {
            text-align: center;
            margin-top: 25px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
            color: var(--primary);
        }
    </style>
</head>

<body>

    <main class="container">
        <h1>Enlaces y Listas</h1>

        <section class="section-box">
            <h2>Red Social Favorita</h2>
            <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="social-link">
                Visitar mi perfil de GitHub &rarr;
            </a>
        </section>

        <section class="section-box">
            <h2>Mis Pasatiempos</h2>
            <ul>
                <li>Programación y desarrollo de software</li>
                <li>Videojuegos de estrategia y aventura</li>
                <li>Diseño gráfico y edición de video</li>
                <li>Montaje y configuración de hardware de PC</li>
            </ul>
        </section>

        <div class="nav-footer">
            <a href="index.html" class="btn-back">&larr; Volver al Menú Principal</a>
        </div>
    </main>

</body>

</html>
